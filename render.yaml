databases:
  - name: stadium-db
    plan: free

services:
  - type: web
    name: stadium-booking
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "bash start.sh"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: stadium-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: DJANGO_ALLOWED_HOSTS
        value: sportsproject.onrender.com
      - key: PUBLIC_BASE_URL
        value: https://sportsproject.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://sportsproject.onrender.com
      - key: EXOTEL_FROM_NUMBER
        value: "08047361459"
      - key: EXOTEL_SUBDOMAIN
        value: api.exotel.com
      - key: EXOTEL_VOICE_APP_ID
        value: "1323148"
      - key: EXOTEL_OUTBOUND_ENABLED
        value: "true"
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: SARVAM_STT_MODEL
        value: saaras:v3
      - key: SARVAM_LANGUAGE_CODE
        value: unknown
      - key: MSG91_SENDER
        value: STADIUM
      - key: INVOICE_SIGNING_SALT
        generateValue: true
