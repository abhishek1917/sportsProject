{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Phone number required{% endblock %}

{% block content %}
<main class="mx-auto max-w-md px-6 py-16">
    <h1 class="text-3xl font-semibold tracking-tight">Add your phone number</h1>
    <p class="mt-2 text-stone-500">Every account needs a phone number. The AI agent will call this number when you use Book on call.</p>
    <div class="mt-8 rounded-2xl border border-stone-200 bg-white p-6">
        {% crispy form %}
    </div>
</main>
{% endblock %}
