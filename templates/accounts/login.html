{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Log in{% endblock %}

{% block content %}
<main class="mx-auto max-w-md px-6 py-16">
    <h1 class="text-3xl font-semibold tracking-tight">Log in</h1>
    <p class="mt-2 text-stone-500">You need an account to book a court.</p>
    <div class="mt-8 rounded-2xl border border-stone-200 bg-white p-6">
        {% crispy form %}
    </div>
    <p class="mt-6 text-sm text-stone-500">
        New here?
        <a class="font-medium text-emerald-800" href="{% url 'accounts:signup' %}">Create an account</a>
    </p>
</main>
{% endblock %}
